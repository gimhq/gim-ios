name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit-linux:
    name: GIMKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4

      - name: Test GIMKit
        run: swift test --package-path Packages/GIMKit

      - name: Lint Swift sources
        run: |
          find . -name '*.swift' -not -path '*/.build/*' -print0 \
            | xargs -0 -r swift format lint --strict --parallel

  ios:
    name: iOS (xcodebuild)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick iPhone simulator
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[]
                | select(.key | contains("iOS"))
                | .value[] | select(.name | startswith("iPhone"))]
                | last | .udid // empty')
          if [ -z "$SIM" ]; then
            SIM=$(xcrun simctl list devices available -j \
              | jq -r '[.devices[][] | select(.name == "iPhone 16")] | first | .udid // empty')
          fi
          if [ -z "$SIM" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project GIM.xcodeproj \
            -scheme GIM \
            -destination "platform=iOS Simulator,id=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/results/GIM-build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Test GIMKit
        working-directory: Packages/GIMKit
        run: |
          set -o pipefail
          # Multi-product packages expose their tests via the "<name>-Package" scheme.
          SCHEME=GIMKit
          if xcodebuild -list -json | jq -e '.workspace.schemes | index("GIMKit-Package")' >/dev/null; then
            SCHEME=GIMKit-Package
          fi
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/results/GIMKit-test.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Test GIMUI
        working-directory: Packages/GIMUI
        run: |
          set -o pipefail
          # Multi-product packages expose their tests via the "<name>-Package" scheme.
          SCHEME=GIMUI
          if xcodebuild -list -json | jq -e '.workspace.schemes | index("GIMUI-Package")' >/dev/null; then
            SCHEME=GIMUI-Package
          fi
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/results/GIMUI-test.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload xcresult bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/results/*.xcresult
          if-no-files-found: ignore

  ios-e2e:
    name: iOS E2E (XCUITest + gim-server)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ci/fixtures/gim-server/SOURCE.md pins no Bun version; this is the version the fixture was verified with.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Start gim-server
        run: scripts/start-gim-server.sh start 8080

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick iPhone simulator
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[]
                | select(.key | contains("iOS"))
                | .value[] | select(.name | startswith("iPhone"))]
                | last | .udid // empty')
          if [ -z "$SIM" ]; then
            SIM=$(xcrun simctl list devices available -j \
              | jq -r '[.devices[][] | select(.name == "iPhone 16")] | first | .udid // empty')
          fi
          if [ -z "$SIM" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Using simulator $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      - name: Seed photo library
        run: |
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl addmedia "$SIM" GIM/UITests/Fixtures/photo-library-seed.png

      # Signed ad hoc ("Sign to Run Locally") instead of CODE_SIGNING_ALLOWED=NO: an unsigned simulator app has no
      # application-identifier entitlement, so its Keychain writes fail (errSecMissingEntitlement) and onboarding
      # stops with a storage error. The raw log is kept next to the xcresult; xcbeautify drops failure locations.
      - name: Run XCUITest smoke
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          xcodebuild test \
            -project GIM.xcodeproj \
            -scheme GIM \
            -only-testing:GIMUITests \
            -destination "platform=iOS Simulator,id=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/results/GIM-e2e.xcresult" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            2>&1 | tee "$RUNNER_TEMP/results/xcodebuild-e2e.log" | xcbeautify

      # MessagingSmokeTests prints one "[e2e-summary] a=pass ..." line from a teardown block, also on failure.
      - name: E2E step summary
        if: always()
        run: |
          LINE=$(grep -o '\[e2e-summary\].*' "$RUNNER_TEMP/results/xcodebuild-e2e.log" 2>/dev/null | tail -1 || true)
          if [ -z "$LINE" ]; then
            echo "::notice::No [e2e-summary] line in xcodebuild-e2e.log"
            exit 0
          fi
          echo "$LINE"
          {
            echo '### iOS E2E steps'
            echo '```'
            echo "$LINE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop gim-server
        if: always()
        run: scripts/start-gim-server.sh stop

      - name: Upload xcresult and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e
          path: |
            ${{ runner.temp }}/results/*.xcresult
            ${{ runner.temp }}/results/xcodebuild-e2e.log
            .gim-server/server.log
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-log
          path: ${{ runner.temp }}/results/xcodebuild-e2e.log
          if-no-files-found: ignore
          retention-days: 14
