name: GIM
options:
  bundleIdPrefix: im.g
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GIMKit:
    path: Packages/GIMKit
  GIMUI:
    path: Packages/GIMUI
  GIMCore:
    path: Vendor/GIMCore
targets:
  GIM:
    type: application
    platform: iOS
    sources:
      - GIM/Sources
      - GIM/Resources
      # `AboutInfo` reads the bundled gim-core version for Settings.
      - path: GIM_CORE_VERSION
        buildPhase: resources
    dependencies:
      - package: GIMUI
        product: GIMUI
      - package: GIMKit
        product: GIMClientKit
      - package: GIMKit
        product: GIMFeatures
      - target: GIMNotificationService
    info:
      # Generated by `xcodegen generate`; merged with the INFOPLIST_KEY_* build settings below.
      path: GIM/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Pre-filled server when none was used yet; the `-GIMDefaultServerURL <url>` launch argument overrides it.
        GIMDefaultServerURL: $(GIM_DEFAULT_SERVER_URL)
        # Default keep server; empty uses https://keep.g.im, `off` disables it. The `-GIMDefaultKeepServerURL <url|off>`
        # launch argument overrides it, and the Settings choice overrides both.
        GIMDefaultKeepServerURL: $(GIM_DEFAULT_KEEP_SERVER_URL)
        # `mock-ios-sim` registers a push token for gim-push-mock + `xcrun simctl push` (README "Push"); empty
        # registers nothing.
        GIMPushProvider: $(GIM_PUSH_PROVIDER)
        # Debug: `gim-debug://process-push?payload=<base64url>` runs the extension's push handler in-app (README
        # "Push"); the Release scheme is empty, and Release has no code for it.
        CFBundleURLTypes:
          - CFBundleURLName: im.g.apps.debug
            CFBundleURLSchemes:
              - $(GIM_DEBUG_URL_SCHEME)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # English source of the usage descriptions; GIM/Resources/InfoPlist.xcstrings localizes them.
        NSCameraUsageDescription: GIM uses the camera to scan the code shown on your other device.
        NSPhotoLibraryUsageDescription: GIM shows your photos so you can choose which ones to send.
        NSFaceIDUsageDescription: GIM uses Face ID to make sure it's you before showing your recovery key.
    # Generated by `xcodegen generate`. The App Group holds the data directory, the Keychain items (as their access
    # group) and the settings shared with the Notification Service Extension.
    entitlements:
      path: GIM/GIM.entitlements
      properties:
        com.apple.security.application-groups:
          - group.im.g.apps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.g.apps
        PRODUCT_NAME: GIM
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          GIM_DEFAULT_SERVER_URL: http://localhost:8080
          GIM_PUSH_PROVIDER: mock-ios-sim
          GIM_DEBUG_URL_SCHEME: gim-debug
        Release:
          GIM_DEFAULT_SERVER_URL: https://hub.g.im
          GIM_PUSH_PROVIDER: ""
          GIM_DEBUG_URL_SCHEME: ""
  # Decrypts pushes with gim-core on the App Group's local state; links no SwiftUI (GIMPlatform, not GIMUI).
  GIMNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: GIM/NotificationService
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: GIMUI
        product: GIMPlatform
      - package: GIMKit
        product: GIMClientKit
      - package: GIMKit
        product: GIMFeatures
    info:
      # Generated by `xcodegen generate`.
      path: GIM/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: GIM Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    # Generated by `xcodegen generate`. The filtering entitlement lets the extension hide pushes gim-core says not to
    # display; App Store builds need Apple's approval for it (README "Push").
    entitlements:
      path: GIM/NotificationService/GIMNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.im.g.apps
        com.apple.developer.usernotifications.filtering: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.g.apps.nse
        PRODUCT_NAME: GIMNotificationService
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  # Device E2E smoke tests: drive the app against a running gim-hub (scripts/e2e-hub.sh, run via
  # scripts/mac-gate.sh e2e) with scripted gim-core peers in the test runner. See README.md.
  GIMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GIM/UITests
        excludes:
          - Fixtures
    dependencies:
      - target: GIM
      - package: GIMCore
        product: GIMCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.g.apps.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  # Builds and runs the app; `test` runs the E2E smoke tests, which need a gim-hub (scripts/e2e-hub.sh +
  # scripts/mac-gate.sh e2e) passed as TEST_RUNNER_GIM_E2E_SERVER_URL. Package tests
  # run from each package directory, e.g. `xcodebuild test -scheme GIMUI` in Packages/GIMUI (or `GIMKit-Package` in
  # Packages/GIMKit).
  GIM:
    build:
      targets:
        GIM: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GIMUITests
    archive:
      config: Release
