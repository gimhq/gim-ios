name: GIM
options:
  bundleIdPrefix: im.g
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GIMKit:
    path: Packages/GIMKit
  GIMUI:
    path: Packages/GIMUI
  GIMCore:
    path: Vendor/GIMCore
targets:
  GIM:
    type: application
    platform: iOS
    sources:
      - GIM/Sources
      - GIM/Resources
    dependencies:
      - package: GIMUI
        product: GIMUI
      - package: GIMKit
        product: GIMClientKit
      - package: GIMKit
        product: GIMFeatures
    info:
      # Generated by `xcodegen generate`; merged with the INFOPLIST_KEY_* build settings below.
      path: GIM/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Pre-filled server when none was used yet; the `-GIMDefaultServerURL <url>` launch argument overrides it.
        GIMDefaultServerURL: $(GIM_DEFAULT_SERVER_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Scan the code shown on your new device.
        NSPhotoLibraryUsageDescription: Choose photos to send.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.g.apps
        PRODUCT_NAME: GIM
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          GIM_DEFAULT_SERVER_URL: http://localhost:8080
        Release:
          GIM_DEFAULT_SERVER_URL: ""
  # Device E2E smoke tests: drive the app against a running gim-hub (scripts/e2e-hub.sh, run via
  # scripts/mac-gate.sh e2e) with scripted gim-core peers in the test runner. See README.md.
  GIMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GIM/UITests
        excludes:
          - Fixtures
    dependencies:
      - target: GIM
      - package: GIMCore
        product: GIMCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.g.apps.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  # Builds and runs the app; `test` runs the E2E smoke tests, which need a gim-hub (scripts/e2e-hub.sh +
  # scripts/mac-gate.sh e2e) passed as TEST_RUNNER_GIM_E2E_SERVER_URL. Package tests
  # run from each package directory, e.g. `xcodebuild test -scheme GIMUI` in Packages/GIMUI (or `GIMKit-Package` in
  # Packages/GIMKit).
  GIM:
    build:
      targets:
        GIM: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GIMUITests
    archive:
      config: Release
